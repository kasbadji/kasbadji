name: Metrics
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1. Vos métriques principales (conservées)
      - name: Main metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: percentage

      # 2. Calendrier isométrique (conservé)
      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-isometric.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 3. Graphique des commits par jour (remplace le plugin habits pour éviter l'erreur)
      - name: Generate Activity Graph
        uses: Ashutosh0887/github-readme-activity-graph@v1.2.9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output_filename: github-metrics-habits.svg
          theme: react
          area: true
          hide_border: true

      # 4. Commit du fichier SVG généré
      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add github-metrics-habits.svg
          git commit -m "Update activity graph" || exit 0
          git push
