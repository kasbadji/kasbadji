name: Metrics
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1. Main metrics (lowlighter)
      - name: Main metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: percentage

      # 2. Isometric commit calendar (lowlighter)
      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-isometric.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 3. Daily Commit Activity Graph
      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: github-metrics-habits.svg
          theme: react
          area: true
          hide_border: true

      # 4. Commit generated SVG back to main branch
      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add github-metrics-habits.svg
          git commit -m "Update activity graph SVG" || exit 0
          git push
